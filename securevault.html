<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 2rem;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(10px);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo i {
            font-size: 3rem;
            color: #1e3c72;
            margin-bottom: 1rem;
        }

        h2 {
            text-align: center;
            margin-bottom: 2rem;
            color: #1e3c72;
            font-size: 1.8rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #4a5568;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #718096;
        }

        input {
            width: 100%;
            padding: 1rem;
            padding-left: 2.8rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        input:focus {
            outline: none;
            border-color: #1e3c72;
            box-shadow: 0 0 0 3px rgba(30, 60, 114, 0.1);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(30, 60, 114, 0.3);
        }

        .error {
            color: #e53e3e;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .otp-container {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
            justify-content: center;
        }

        .otp-input {
            width: 3.5rem;
            height: 3.5rem;
            text-align: center;
            font-size: 1.5rem;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            background: white;
            padding: 0;
            font-weight: 600;
            color: #1e3c72;
        }

        .otp-input:focus {
            border-color: #1e3c72;
            box-shadow: 0 0 0 3px rgba(30, 60, 114, 0.1);
        }

        #otpForm {
            display: none;
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-header p {
            color: #718096;
            margin-top: 0.5rem;
        }

        .success {
            color: #38a169;
            text-align: center;
            margin-top: 1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            animation: fadeIn 0.5s ease-out;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }

        .loading i {
            color: #1e3c72;
            font-size: 1.5rem;
        }
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <form id="loginForm">
            <div class="logo">
                <i class="fas fa-shield-alt"></i>
                <h2>Secure Login</h2>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" required>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" required>
                </div>
            </div>
            <button type="submit">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
            <div id="loginError" class="error"></div>
            <div class="loading" id="loginLoading">
                <i class="fas fa-circle-notch fa-spin"></i>
            </div>
        </form>

        <!-- OTP Form -->
        <form id="otpForm">
            <div class="form-header">
                <i class="fas fa-key" style="font-size: 2rem; color: #1e3c72; margin-bottom: 1rem;"></i>
                <h2>Two-Factor Authentication</h2>
                <p>Please enter the verification code sent to your email</p>
            </div>
            <div class="form-group">
                <div class="otp-container">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
                </div>
            </div>
            <button type="submit">Verify Code</button>
            <button type="button" id="resendCode" style="margin-top: 1rem; background: transparent; border: 1px solid #1e3c72; color: #1e3c72;">
                <i class="fas fa-redo"></i> Resend Code
            </button>
            <div id="otpError" class="error"></div>
        </form>
    </div>

    <script>
        // Replace these with your actual credentials and Web3Forms API key
        const VALID_USERNAME = 'admin';
        const VALID_PASSWORD = 'password123';
        const WEB3FORMS_API_KEY = '2def5933-b1c7-4028-8655-c2c6b2bf08e2';
        const OWNER_EMAIL = 'rudragupta415@gmail.com';
        
        // Generate random 6-digit OTP
        const generateOTP = () => {
            return Math.floor(100000 + Math.random() * 900000).toString();
        };

        let currentOTP = '';

        // Handle OTP input fields
        const otpInputs = document.querySelectorAll('.otp-input');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });

            input.addEventListener('keypress', (e) => {
                if (!/[0-9]/.test(e.key)) {
                    e.preventDefault();
                }
            });
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginError = document.getElementById('loginError');
            const loginLoading = document.getElementById('loginLoading');

            loginError.textContent = '';
            loginLoading.style.display = 'block';

            // Validate credentials
            if (username === VALID_USERNAME && password === VALID_PASSWORD) {
                currentOTP = generateOTP();
                
                try {
                    const formData = {
                        apikey: WEB3FORMS_API_KEY,
                        from_name: 'Secure Login',
                        to: OWNER_EMAIL,
                        subject: `Your login verification code: ${currentOTP}`,
                        message: `
                            Security Code: ${currentOTP}
                            
                            This is your verification code for secure login.
                            The code will expire in 5 minutes.
                            
                            If you didn't request this code, please ignore this email.
                        `
                    };

                    const response = await fetch('https://api.web3forms.com/submit', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(formData)
                    });

                    loginLoading.style.display = 'none';

                    if (response.ok) {
                        document.getElementById('loginForm').style.display = 'none';
                        document.getElementById('otpForm').style.display = 'block';
                        otpInputs[0].focus();
                    } else {
                        loginError.innerHTML = '<i class="fas fa-exclamation-circle"></i> Error sending verification code. Please try again.';
                    }
                } catch (error) {
                    loginLoading.style.display = 'none';
                    loginError.innerHTML = '<i class="fas fa-exclamation-circle"></i> Error sending verification code. Please try again.';
                }
            } else {
                loginLoading.style.display = 'none';
                loginError.innerHTML = '<i class="fas fa-exclamation-circle"></i> Invalid username or password';
            }
        });

        document.getElementById('otpForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const enteredOTP = Array.from(otpInputs)
                .map(input => input.value)
                .join('');
            const otpError = document.getElementById('otpError');

            if (enteredOTP === currentOTP) {
                sessionStorage.setItem('authenticated', 'true');
                sessionStorage.setItem('sessionStart', new Date().getTime().toString());
                window.location.href = 'securedashboard';
            } else {
                otpError.innerHTML = '<i class="fas fa-exclamation-circle"></i> Invalid verification code. Please try again.';
                otpInputs.forEach(input => {
                    input.value = '';
                });
                otpInputs[0].focus();
            }
        });

        // Handle resend code button
        document.getElementById('resendCode').addEventListener('click', async () => {
            const otpError = document.getElementById('otpError');
            currentOTP = generateOTP();
            
            try {
                const formData = {
                    apikey: WEB3FORMS_API_KEY,
                    from_name: 'Secure Login',
                    to: OWNER_EMAIL,
                    subject: `Your login verification code: ${currentOTP}`,
                    message: `
                        Security Code: ${currentOTP}
                        
                        This is your verification code for secure login.
                        The code will expire in 5 minutes.
                        
                        If you didn't request this code, please ignore this email.
                    `
                };

                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    otpError.innerHTML = '<i class="fas fa-check-circle" style="color: green;"></i> New code sent successfully!';
                    otpInputs.forEach(input => {
                        input.value = '';
                    });
                    otpInputs[0].focus();
                } else {
                    otpError.innerHTML = '<i class="fas fa-exclamation-circle"></i> Error sending verification code. Please try again.';
                }
            } catch (error) {
                otpError.innerHTML = '<i class="fas fa-exclamation-circle"></i> Error sending verification code. Please try again.';
            }
        });

        (function() {
            // Function to close the window
            function closeWindow() {
                window.close();
                // For browsers that don't allow window.close()
                window.location.href = 'about:blank';
            }
    
            // Method 1: Detect right click
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });
    
            // Method 2: Detect keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                // Detect common DevTools shortcuts
                if (
                    (e.ctrlKey && e.shiftKey && e.keyCode === 73) || // Ctrl+Shift+I
                    (e.ctrlKey && e.shiftKey && e.keyCode === 74) || // Ctrl+Shift+J
                    (e.ctrlKey && e.keyCode === 85) ||              // Ctrl+U
                    e.keyCode === 123                               // F12
                ) {
                    e.preventDefault();
                    closeWindow();
                }
            });
    
            // Method 3: Size change detection
            let detectDevTools = function() {
                const threshold = 160;
                const widthThreshold = window.outerWidth - window.innerWidth > threshold;
                const heightThreshold = window.outerHeight - window.innerHeight > threshold;
                
                if (widthThreshold || heightThreshold) {
                    closeWindow();
                }
            }
    
            // Method 4: Console clear and warning
            const consoleOutput = function() {
                console.clear();
            };
    
            // Attach only necessary listeners
            window.addEventListener('resize', detectDevTools);
            
            // Disable various debugging features
            document.onkeydown = function(e) {
                if(e.keyCode == 123) { // F12
                    closeWindow();
                    return false;
                }
                if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { // Ctrl+Shift+I
                    closeWindow();
                    return false;
                }
                if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { // Ctrl+Shift+C
                    closeWindow();
                    return false;
                }
                if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { // Ctrl+Shift+J
                    closeWindow();
                    return false;
                }
                if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { // Ctrl+U
                    closeWindow();
                    return false;
                }
            }
    
            // Disable right click
            document.onmousedown = function(e) {
                if(e.button == 2) {
                    return false;
                }
            }
        })();
    </script>
</body>
</html>
